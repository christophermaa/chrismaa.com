name: CI & nightly feed

# Hostinger deploys this site itself: its GitHub integration builds `main`
# (npm run build → dist) on every push. This workflow:
#   - type-checks and builds every push and pull request, so broken code is caught before it ships
#   - refreshes the GitHub feed nightly and commits the cache to `main` when the repos changed,
#     which makes Hostinger rebuild the site with fresh data
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Type check
        run: npm run check

      - name: Build
        run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit refreshed GitHub feed (nightly / manual only)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          if node scripts/feed-changed.mjs; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/data/github-cache.json
            git commit -m "chore: refresh GitHub feed cache"
            git push origin HEAD:main
          fi
